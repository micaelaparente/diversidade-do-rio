<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diversidade do Rio</title>
<meta name="description" content="Pôsteres de dados sobre quando o Rio muda: árvores em flor e aves migratórias, semana a semana.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: cabeçalho com o projeto e a lista de pôsteres; abaixo, o pôster à esquerda
   (hover por mês) e a ficha à direita; no celular, tudo em uma coluna */
:root {
  --bg: #e6e7ea;
  --fg: #1c2230;
  --muted: #5a6273;
  --linha: #c9ccd3;
  --cartao: #fbfaf6;
  --acento: #3d5588;      /* azul de riso, a tinta escura dos primeiros pôsteres */
  --sombra: rgba(20, 28, 44, .26);
  --veu: rgba(230, 231, 234, .64);
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161e; --fg: #ebe8e0; --muted: #9ba2b1; --linha: #2c3341; --cartao: #1b2130;
    --acento: #9cb3e6; --sombra: rgba(0, 0, 0, .55); --veu: rgba(18, 22, 30, .64); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161e; --fg: #ebe8e0; --muted: #9ba2b1; --linha: #2c3341; --cartao: #1b2130;
  --acento: #9cb3e6; --sombra: rgba(0, 0, 0, .55); --veu: rgba(18, 22, 30, .64); color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 14px; line-height: 1.55;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pagina { max-width: 1180px; margin: 0 auto; display: grid; gap: 28px; }
header { display: grid; gap: 14px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 6vw, 56px); line-height: .95;
  letter-spacing: -.02em; margin: 0; text-wrap: balance; font-variation-settings: "opsz" 96; }
.intro { margin: 0; max-width: 62ch; color: var(--muted); }
nav { display: flex; flex-wrap: wrap; gap: 8px; }
nav a { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border: 1px solid var(--linha);
  border-radius: 999px; color: var(--fg); text-decoration: none; font-size: 13px; }
nav a img { width: 26px; height: 36px; object-fit: cover; border-radius: 2px; }
nav a[aria-current="page"] { border-color: var(--fg); background: var(--cartao); }
nav a:focus-visible, button:focus-visible, .poster:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

.vista { display: grid; grid-template-columns: minmax(0, auto) minmax(260px, 340px); gap: 32px; align-items: start; }
@media (max-width: 820px) { .vista { grid-template-columns: minmax(0, 1fr); } }

.poster { position: relative; width: min(100%, calc((100vh - 60px) * 700 / 980), 760px); aspect-ratio: 700 / 980;
  box-shadow: 0 18px 50px -18px var(--sombra), 0 2px 6px var(--sombra); cursor: crosshair; touch-action: manipulation; }
.poster img { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
.veu { position: absolute; left: 0; right: 0; background: var(--veu); pointer-events: none; opacity: 0; transition: opacity .18s ease; }
.veu.cima { top: 0; } .veu.baixo { bottom: 0; }
.faixa { position: absolute; left: 0; right: 0; pointer-events: none; opacity: 0;
  border-top: 1.5px solid var(--fg); border-bottom: 1.5px solid var(--fg); transition: opacity .18s ease; }
.ativo .veu, .ativo .faixa { opacity: 1; }
.balao { position: absolute; z-index: 2; width: min(280px, 78vw); background: var(--cartao); color: var(--fg);
  border-radius: 3px; box-shadow: 0 10px 30px -8px var(--sombra); padding: 14px 16px 12px; pointer-events: none;
  opacity: 0; transform: translateY(4px); transition: opacity .15s ease, transform .15s ease; }
.ativo .balao { opacity: 1; transform: none; }
.balao h3 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; margin: 0 0 4px; }
.balao .sub { font-size: 11px; color: var(--muted); margin: 0 0 10px; }
.balao ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.balao li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 3px 8px; align-items: center; font-size: 12px; }
.bola { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .22); }
.balao .pct { font-variant-numeric: tabular-nums; font-weight: 500; }
.barra { grid-column: 2 / 4; height: 3px; background: color-mix(in srgb, var(--fg) 10%, transparent); border-radius: 2px; overflow: hidden; }
.barra i { display: block; height: 100%; }
.balao .n { grid-column: 2 / 4; font-size: 10.5px; color: var(--muted); margin-top: -3px; font-variant-numeric: tabular-nums; }
.balao .destaques { margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--linha); font-size: 11px; color: var(--muted); }

aside { display: grid; gap: 18px; position: sticky; top: max(20px, env(safe-area-inset-top, 0px)); min-width: 0; }
aside h2 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.02; margin: 0; text-wrap: balance; }
aside .subtitulo { margin: 0; }
aside .descricao { margin: 0; color: var(--muted); font-size: 13px; }
.legenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12.5px; }
.legenda li { display: flex; align-items: center; gap: 8px; }
.dica { font-size: 12px; color: var(--muted); margin: 0; }
.baixar { display: grid; gap: 6px; }
button { font: inherit; font-size: 13px; padding: 10px 14px; border-radius: 3px; border: 1px solid var(--fg);
  background: var(--fg); color: var(--bg); cursor: pointer; justify-self: start; }
button[disabled] { opacity: .55; cursor: default; }
.baixar small { font-size: 11px; color: var(--muted); }
footer { font-size: 11.5px; color: var(--muted); max-width: 70ch; }
@media (prefers-reduced-motion: reduce) { .veu, .faixa, .balao { transition: none; } }
</style>

<div class="pagina">
  <header>
    <h1>Diversidade do Rio</h1>
    <p class="intro">Pôsteres de dados sobre quando a cidade muda: o que floresce, quem chega e quem vai embora, semana a semana. Passe o cursor sobre um pôster para ver os números de cada mês.</p>

  <main class="vista">

      <div class="faixa" id="faixa"></div>

    </div>
    <aside>

        <small id="infoBaixar"></small>
      </div>
    </aside>
  </main>

  <footer id="rodape"></footer>
</div>

const $ = id => document.getElementById(id);
const poster = $("poster"), balao = $("balao"), faixa = $("faixa");
let atual = POSTERES[0], mesAtual = -1;
let downloads = null;

const pct = p => p >= 0.995 ? "100%" : p < 0.01 ? "<1%" : Math.round(p * 100) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function montarNav() {
  $("nav").innerHTML = POSTERES.map(p =>
    `<a href="#${p.id}" data-id="${p.id}"><img src="posteres/${p.id}/poster.jpg" alt="">${esc(p.titulo)}</a>`).join("");
}

function mostrarPoster(id) {
  atual = POSTERES.find(p => p.id === id) || POSTERES[0];
  mesAtual = -1; esconder();
  document.querySelectorAll("#nav a").forEach(a => { if (a.dataset.id === atual.id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  $("imagem").src = `posteres/${atual.id}/poster.jpg`;
  poster.setAttribute("aria-label", `${atual.titulo}: ${atual.subtitulo} Use as setas para ver os dados de cada mês.`);
  $("titulo").textContent = atual.titulo;
  $("subtitulo").textContent = atual.subtitulo;
  $("descricao").textContent = atual.descricao;
  $("legenda").innerHTML = Object.entries(atual.cores).map(([nome, cor]) =>
    `<li><span class="bola" style="background:${cor}"></span>${esc(nome)}</li>`).join("");
  const px = atual.alta_px ? `${atual.alta_px[0]} × ${atual.alta_px[1]} px · 300 dpi (50 × 70 cm)` : "";
  $("infoBaixar").textContent = [`JPEG`, px, atual.alta_mb ? `${atual.alta_mb} MB` : ""].filter(Boolean).join(" · ");
  $("botaoBaixar").disabled = false; $("botaoBaixar").textContent = "Baixar em alta resolução";
  $("rodape").textContent = `Dados: iNaturalist, município do Rio de Janeiro, ${atual.n_total} ${atual.unidade} (${atual.periodo}), ` +
    `todos os anos somados, suavização gaussiana circular de 1,5 semana. Fotos do iNaturalist com licenças CC0 e CC-BY; créditos completos no verso de cada pôster.`;
}

function mesEm(fracY) {
  const semana = Math.min(51, Math.max(0, Math.floor(fracY * 52)));
  return atual.meses.findIndex(m => semana >= m.semana_ini && semana < m.semana_fim);
}

function preencher(i) {
  const m = atual.meses[i];
  const linhas = m.grupos.map(g => `
    <li><span class="bola" style="background:${atual.cores[g.nome]}"></span>
      <span>${esc(g.nome)}</span><span class="pct">${pct(g.parte)}</span>
      <span class="barra"><i style="width:${(g.parte * 100).toFixed(1)}%;background:${atual.cores[g.nome]}"></i></span>
      <span class="n">${g.n} ${g.n === 1 ? "registro" : "registros"}</span></li>`).join("");
  const destaques = m.destaques && m.destaques.length
    ? `<p class="destaques">Mais registradas: ${m.destaques.map(d => `${esc(d.nome)} (${d.n})`).join(", ")}</p>` : "";
  balao.innerHTML = `<h3>${m.mes}</h3><p class="sub">${m.total} ${atual.unidade} · ${atual.periodo}</p><ol>${linhas}</ol>${destaques}`;
}

function mostrarMes(i, x, y) {
  const h = poster.clientHeight, w = poster.clientWidth;
  if (i !== mesAtual) { mesAtual = i; preencher(i); }
  const m = atual.meses[i];
  const y0 = m.semana_ini / 52 * h, y1 = m.semana_fim / 52 * h;
  faixa.style.top = y0 + "px"; faixa.style.height = (y1 - y0) + "px";
  $("veuCima").style.height = y0 + "px"; $("veuBaixo").style.height = (h - y1) + "px";
  poster.classList.add("ativo");
  const bw = balao.offsetWidth, bh = balao.offsetHeight, folga = 18;
  let bx = x + folga;
  if (bx + bw > w - 8) bx = x - bw - folga;
  if (bx < 8) bx = Math.max(8, Math.min(w - bw - 8, x - bw / 2));
  const by = Math.max(8, Math.min(h - bh - 8, y - bh / 2));
  balao.style.left = bx + "px"; balao.style.top = by + "px";
}
function esconder() { poster.classList.remove("ativo"); }

poster.addEventListener("pointermove", e => {
  const r = poster.getBoundingClientRect();
  const i = mesEm((e.clientY - r.top) / r.height);
  if (i >= 0) mostrarMes(i, e.clientX - r.left, e.clientY - r.top);
});
poster.addEventListener("pointerdown", e => {
  const r = poster.getBoundingClientRect();
  const i = mesEm((e.clientY - r.top) / r.height);
  if (i >= 0) mostrarMes(i, e.clientX - r.left, e.clientY - r.top);
});
poster.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") esconder(); });
poster.addEventListener("keydown", e => {
  if (!["ArrowDown", "ArrowUp", "Escape"].includes(e.key)) return;
  e.preventDefault();
  if (e.key === "Escape") return esconder();
  const i = mesAtual < 0 ? 0 : (mesAtual + (e.key === "ArrowDown" ? 1 : 11)) % 12;
  const m = atual.meses[i];
  mostrarMes(i, poster.clientWidth * 0.5, (m.semana_ini + m.semana_fim) / 2 / 52 * poster.clientHeight);
});
poster.addEventListener("blur", esconder);

// download em alta resolução: o visitante confirma o salvamento
$("botaoBaixar").addEventListener("click", async () => {
  const b = $("botaoBaixar");
  if (!downloads) {
    const a = document.createElement("a");
    a.href = `posteres/${atual.id}/alta.jpg`; a.download = atual.arquivo_alta;
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  b.disabled = true; b.textContent = "Preparando o arquivo…";
  try {
    const resp = await fetch(`posteres/${atual.id}/alta.jpg`);
    if (!resp.ok) throw { code: "fetch" };
    const blob = await resp.blob();
    b.textContent = "Confirme para salvar";
    await downloads.save({ filename: atual.arquivo_alta, data: blob });
    b.textContent = "Arquivo salvo";
  } catch (err) {
    const code = err && err.code;
    b.textContent = "Baixar em alta resolução";
    if (code === "fetch") $("infoBaixar").textContent = "Não foi possível carregar o arquivo. Tente de novo.";
    else if (code === "rate_limited") $("infoBaixar").textContent = "Já há um pedido aberto. Conclua ou feche antes de tentar de novo.";
    else if (code && code !== "declined") $("infoBaixar").textContent = "O download não está disponível nesta visualização.";
  } finally {
    setTimeout(() => { b.disabled = false; if (b.textContent !== "Baixar em alta resolução") b.textContent = "Baixar em alta resolução"; }, 2500);
  }
});

function pelaUrl() { mostrarPoster((location.hash || "").slice(1)); }
window.addEventListener("hashchange", pelaUrl);
montarNav(); pelaUrl();

(async () => {
  try { downloads = window.claude && await window.claude.use("downloads"); } catch (e) { downloads = null; }
})();
</script>
